name: Build Debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev
          glslc --version
          test -f /usr/include/vulkan/vulkan.hpp
          test -f /usr/include/vk_video/vulkan_video_codec_h264std.h

      - name: Use NDK glslc for llama.cpp Vulkan shaders
        run: |
          NDK_GLSLC="$ANDROID_HOME/ndk/26.1.10909125/shader-tools/linux-x86_64/glslc"
          test -x "$NDK_GLSLC"
          "$NDK_GLSLC" --version
          sudo ln -sf "$NDK_GLSLC" /usr/local/bin/glslc
          command -v glslc
          glslc --version

      - name: Stage Vulkan headers into Android NDK sysroot
        run: |
          NDK_SYSROOT="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          sudo mkdir -p "$NDK_SYSROOT/usr/include/vulkan" "$NDK_SYSROOT/usr/include/vk_video"
          sudo cp -a /usr/include/vulkan/. "$NDK_SYSROOT/usr/include/vulkan/"
          sudo cp -a /usr/include/vk_video/. "$NDK_SYSROOT/usr/include/vk_video/"
          test -f "$NDK_SYSROOT/usr/include/vulkan/vulkan.hpp"
          test -f "$NDK_SYSROOT/usr/include/vk_video/vulkan_video_codec_h264std.h"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: closepaw-gguf-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
