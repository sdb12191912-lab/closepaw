name: Build Debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev
          glslc --version
          test -f /usr/include/vulkan/vulkan.hpp
          test -f /usr/include/vk_video/vulkan_video_codec_h264std.h

      - name: Use NDK glslc for llama.cpp Vulkan shaders
        run: |
          NDK_GLSLC="$ANDROID_HOME/ndk/26.1.10909125/shader-tools/linux-x86_64/glslc"
          test -x "$NDK_GLSLC"
          "$NDK_GLSLC" --version
          sudo ln -sf "$NDK_GLSLC" /usr/local/bin/glslc
          command -v glslc
          glslc --version

      - name: Patch llama.cpp Vulkan coopmat detection for Android
        run: |
          CMAKE_FILE="third_party/llama.cpp/ggml/src/ggml-vulkan/CMakeLists.txt"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("third_party/llama.cpp/ggml/src/ggml-vulkan/CMakeLists.txt")
          text = path.read_text()

          old1 = '''    if (${glslc_error} MATCHES ".*extension not supported: GL_KHR_cooperative_matrix.*")\n        message(STATUS "GL_KHR_cooperative_matrix not supported by glslc")\n    else()\n        message(STATUS "GL_KHR_cooperative_matrix supported by glslc")\n        add_compile_definitions(GGML_VULKAN_COOPMAT_GLSLC_SUPPORT)\n    endif()'''
          new1 = '''    if (ANDROID)\n        message(STATUS "GL_KHR_cooperative_matrix disabled for Android build")\n    elseif (${glslc_error} MATCHES ".*extension not supported: GL_KHR_cooperative_matrix.*")\n        message(STATUS "GL_KHR_cooperative_matrix not supported by glslc")\n    else()\n        message(STATUS "GL_KHR_cooperative_matrix supported by glslc")\n        add_compile_definitions(GGML_VULKAN_COOPMAT_GLSLC_SUPPORT)\n    endif()'''

          old2 = '''    if (${glslc_error} MATCHES ".*extension not supported: GL_NV_cooperative_matrix2.*")\n        message(STATUS "GL_NV_cooperative_matrix2 not supported by glslc")\n    else()\n        message(STATUS "GL_NV_cooperative_matrix2 supported by glslc")\n        add_compile_definitions(GGML_VULKAN_COOPMAT2_GLSLC_SUPPORT)\n    endif()'''
          new2 = '''    if (ANDROID)\n        message(STATUS "GL_NV_cooperative_matrix2 disabled for Android build")\n    elseif (${glslc_error} MATCHES ".*extension not supported: GL_NV_cooperative_matrix2.*")\n        message(STATUS "GL_NV_cooperative_matrix2 not supported by glslc")\n    else()\n        message(STATUS "GL_NV_cooperative_matrix2 supported by glslc")\n        add_compile_definitions(GGML_VULKAN_COOPMAT2_GLSLC_SUPPORT)\n    endif()'''

          if old1 not in text:
              raise SystemExit("KHR coopmat detection block not found")
          if old2 not in text:
              raise SystemExit("NV coopmat2 detection block not found")

          text = text.replace(old1, new1).replace(old2, new2)
          path.write_text(text)
          PY
          grep -n -A8 -B2 "disabled for Android build" "$CMAKE_FILE"

      - name: Stage Vulkan headers into Android NDK sysroot
        run: |
          NDK_SYSROOT="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          sudo mkdir -p "$NDK_SYSROOT/usr/include/vulkan" "$NDK_SYSROOT/usr/include/vk_video"
          sudo cp -a /usr/include/vulkan/. "$NDK_SYSROOT/usr/include/vulkan/"
          sudo cp -a /usr/include/vk_video/. "$NDK_SYSROOT/usr/include/vk_video/"
          test -f "$NDK_SYSROOT/usr/include/vulkan/vulkan.hpp"
          test -f "$NDK_SYSROOT/usr/include/vk_video/vulkan_video_codec_h264std.h"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: closepaw-gguf-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
